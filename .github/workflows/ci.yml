name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Crates that build on any OS (the Tauri shell needs WebView2 → Windows job).
  CORE_CRATES: -p gc-core -p gc-library -p gc-platform -p gc-audio -p gc-capture

jobs:
  core:
    name: Core crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg (end-to-end pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy $CORE_CRATES --all-targets -- -D warnings
      - name: Test
        run: cargo test $CORE_CRATES

  ui:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Type-check and build
        run: npm run build
        working-directory: ui

  windows:
    name: Windows build & bundle
    runs-on: windows-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Install JS dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        working-directory: ui
      - name: Clippy (workspace, Windows APIs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$PWD\src-tauri\binaries;$env:PATH"
          cargo test ${{ env.CORE_CRATES }}
      - name: Bundle installer
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: game-capture-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/game-capture.exe
          if-no-files-found: error
