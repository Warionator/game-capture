name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new stable release (new lints/deprecations under -D warnings)
  # can't break the build on its own. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  # Crates that build on any OS (the Tauri shell needs WebView2 → Windows job).
  CORE_CRATES: -p gc-core -p gc-library -p gc-platform -p gc-audio -p gc-capture

jobs:
  core:
    name: Core crates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg (end-to-end pipeline tests)
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy $CORE_CRATES --all-targets -- -D warnings
      - name: Test
        run: cargo test $CORE_CRATES

  ui:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Type-check and build
        run: npm run build
        working-directory: ui

  windows:
    name: Windows build & bundle
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [core, ui]
    permissions:
      contents: write # publishing the release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Install JS dependencies (Tauri CLI)
        run: npm ci --ignore-scripts
      - name: Install JS dependencies (UI)
        run: npm ci
        working-directory: ui
      - name: Build frontend
        run: npm run build
        working-directory: ui
      - name: Clippy (workspace, Windows APIs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$PWD\src-tauri\binaries;$env:PATH"
          cargo test ${{ env.CORE_CRATES }}
      - name: Bundle installer
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - name: Assemble portable folder
        id: portable
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "game-capture-$version-windows-x64"
          $stage = Join-Path "target/portable" $name
          New-Item -ItemType Directory -Force -Path "$stage/binaries" | Out-Null
          Copy-Item target/release/game-capture.exe $stage
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll $stage }
          Copy-Item src-tauri/binaries/ffmpeg.exe, src-tauri/binaries/ffprobe.exe, src-tauri/binaries/FFMPEG-LICENSE.txt "$stage/binaries"
          Copy-Item scripts/TESTING.txt "$stage/TESTING.txt"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          "name=$name" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT

      # Downloading this artifact gives game-capture-<version>-windows-x64.zip.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable.outputs.name }}
          path: ${{ steps.portable.outputs.stage }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: game-capture-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.portable.outputs.stage }}" -DestinationPath "target/portable/${{ steps.portable.outputs.name }}.zip" -Force
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Uploads to the release for this tag (creating it if needed) and
          # replaces assets with the same name.
          files: |
            target/portable/${{ steps.portable.outputs.name }}.zip
            target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
