[package]
name = "gc-platform"
description = "Windows integration for game-capture: process watcher & icon extraction, low-level hotkey hook, registry toggles, shell/clipboard helpers and DXGI monitor enumeration. Non-Windows builds get inert stubs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gc-core.workspace = true
anyhow.workspace = true
serde.workspace = true
log.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
