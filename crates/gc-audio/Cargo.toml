[package]
name = "gc-audio"
description = "WASAPI audio capture for game-capture: per-process loopback (Windows 10 2004+), microphone and system loopback, with live per-track gain, mute, peak meters and named-pipe delivery to FFmpeg."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gc-core.workspace = true
gc-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
log.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile.workspace = true
